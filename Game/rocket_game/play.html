<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Questions</title>
    <style>
        /* General Styling */
        body {
            font-family: 'Orbitron', sans-serif;
            background: url('images/bg2.webp') no-repeat center center/cover;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* Heading */
        h2 {
            font-size: 2rem;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.8);
            margin-top: -200px;
        }

        /* Buttons */
        button {
            margin-top: 15px;
            padding: 12px 20px;
            font-size: 18px;
            color: #fff;
            background: linear-gradient(90deg, #00e1ff, #007eff);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 225, 255, 0.8);
        }

        button:hover {
            background: linear-gradient(90deg, #007eff, #00e1ff);
            transform: scale(1.1);
        }

        /* Centering Content */
        body, html {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #go {
            position: relative;
        }

        #go::after {
            content: '☚'; /* Hand emoji */
            position: absolute;
            left: 80px; /* Adjust left position to point at the GO button */
            top: -10px; /* Adjust top position to align vertically with the button */
            font-size: 50px;
            color: #f1f6f2;
            animation: moveLeft 1s infinite alternate;
        }

        @keyframes moveLeft {
            from {
                left: 90px; /* Adjust the animation range */
                opacity: 0.5;
            }
            to {
                left: 70px;
                opacity: 1;
            }
        }
    </style>
    <script>
        function goTo() {
            window.location.href = "index.html";
        }

        function back() {
            window.location.href = "upload.html";
        }
    </script>
</head>
<body>
    <h2>Rocketry Adventure</h2>
    <button id="go" onclick="goTo()">Play</button>
    <button onclick="back()">Back</button>
</body>
</html>
