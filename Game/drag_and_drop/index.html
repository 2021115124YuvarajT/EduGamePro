<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop Game - Input</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('assets/bg1.jpg');
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }
        .container {
            margin: 50px 10px;  
            width: 60%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: left;
            position: sticky;
            top: 0;
            background-color: #fff;
            z-index: 1000;
        }
        .task-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #ffebee;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            font-size: 20px;
        }
        input[type="number"], input[type="text"] {
            width: 80%;
            padding: 11px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        input[type="file"] {
            margin-top: 5px;
        }
        button {
            margin-top: 10px;
            padding: 10px 15px;
            border: none;
            background-color: #28a745;
            font-size: large;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        .category-container {
            margin-top: 10px;
            padding: 10px;
            border: 1px dashed #ccc;
            border-radius: 5px;
            background-color: #e3f2fd;
        }
        .uploads {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            background: #f1f8e9;
            border-radius: 5px;
        }
        .upload-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #backto {
            font-weight: bolder;
        }
        #backto:hover {
            background-color: rgb(155, 19, 19);
        }
        .view-btn {
        position: relative;
        margin-top: 10px;
        padding: 10px 15px;
        border: none;
        font-size: large;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s;
    }

    .view-btn:hover {
        background-color: #0056b3;
    }

    /* Arrow animation */
    .view-btn::after {
        content: '☚'; /* Unicode arrow character */
        position: absolute; 
        left: 100%; 
        top: 50%;
        transform: translateY(-50%);
        font-size: 50px;
        color: #007bff;
        animation: slideArrow 1s infinite ease-in-out;
    }

    @keyframes slideArrow {
        0% {
            transform: translate(10px, -50%);
            opacity: 0;
        }
        50% {
            transform: translate(0px, -50%);
            opacity: 1;
        }
        100% {
            transform: translate(10px, -50%);
            opacity: 0;
        }
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>Setup Drag and Drop Game</h1>
        <label for="numTasks">Number of Tasks:</label>
        <input type="number" id="numTasks" min="1">
        <button onclick="generateTaskInputs()">Generate</button>
        <div id="tasksContainer"></div>
    </div> 

    <div class="buttons-container">
        <button id="backto" onclick="back()">⟸</button>
        <button class="upload-btn" onclick="uploadToDB()">Upload to DB</button>
        <button class="view-btn" onclick="window.location.href='http://127.0.0.1:5500/drag_and_drop/game.html'">View Game</button>
    </div>
    
    <script>
        function back() {
            window.location.href = "../template/games.html";
        }
        function generateTaskInputs() {
            const numTasks = document.getElementById('numTasks').value;
            const tasksContainer = document.getElementById('tasksContainer');
            tasksContainer.innerHTML = '';
            
            for (let i = 1; i <= numTasks; i++) {
                const taskDiv = document.createElement('div');
                taskDiv.classList.add('task-container');
                taskDiv.innerHTML = `
                    <h3>Task ${i}</h3>
                    <label>Number of Categories:</label>
                    <input type="number" min="1" class="numCategories" data-task="${i}">
                    <div class="categories"></div>
                    <button onclick="generateCategories(${i})">Add Categories</button>
                    <p><strong>Total Items in Task ${i}: <span id="totalItems${i}">0</span></strong></p>
                `;
                tasksContainer.appendChild(taskDiv);
            }
        }
        
        function generateCategories(taskId) {
            const numCategories = document.querySelector(`.numCategories[data-task='${taskId}']`).value;
            const categoriesDiv = document.querySelector(`.task-container:nth-child(${taskId}) .categories`);
            categoriesDiv.innerHTML = '';
            
            for (let k = 1; k <= numCategories; k++) {
                categoriesDiv.innerHTML += `
                    <div class="category-container">
                        <label>Category ${k} Name:</label>
                        <input type="text" class="category-name" placeholder="Category name">
                        <label>Number of Items:</label>
                        <input type="number" min="1" class="numItems" data-task="${taskId}" data-category="${k}" oninput="generateUploads(${taskId}, ${k})">
                        <div class="uploads" id="uploads${taskId}-${k}"></div>
                    </div>
                `;
            }
        }
        
        function generateUploads(taskId, categoryId) {
            const numItems = document.querySelector(`.numItems[data-task='${taskId}'][data-category='${categoryId}']`).value;
            const uploadsDiv = document.getElementById(`uploads${taskId}-${categoryId}`);
            uploadsDiv.innerHTML = '';
            
            for (let j = 1; j <= numItems; j++) {
                uploadsDiv.innerHTML += `
                    <div class="upload-row">
                        <label>Item ${j}</label>
                        <input type="text" class="item-name" placeholder="Item name">
                        <input type="file" accept="image/*">
                    </div>
                `;
            }
            updateTotalItems(taskId);
        }
        
        function updateTotalItems(taskId) {
            let totalItems = 0;
            document.querySelectorAll(`.numItems[data-task='${taskId}']`).forEach(input => {
                totalItems += parseInt(input.value) || 0;
            });
            document.getElementById(`totalItems${taskId}`).textContent = totalItems;
        }

        function uploadToDB() {
            const uploadPromises = [];

            document.querySelectorAll('.uploads .upload-row').forEach((row) => {
                const taskContainer = row.closest('.task-container'); // Get parent task container
                const categoryContainer = row.closest('.category-container'); // Get parent category container

                const taskId = taskContainer.querySelector('.numCategories').dataset.task;
                const categoryId = categoryContainer.querySelector('.numItems').dataset.category;
                const categoryName = categoryContainer.querySelector('.category-name').value; // Fixed selector
                const itemName = row.querySelector('.item-name').value;
                const fileInput = row.querySelector('input[type="file"]');

                if (itemName.trim() && fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append('taskId', taskId);
                    formData.append('categoryId', categoryId);
                    formData.append('categoryName', categoryName); // Corrected categoryName selection
                    formData.append('itemName', itemName);
                    formData.append('file', fileInput.files[0]);

                    const promise = fetch('http://localhost:5105/upload', {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.message === 'Item uploaded successfully') {
                            return true;
                        } else {
                            throw new Error('Upload failed');
                        }
                    });

                    uploadPromises.push(promise);
                }
            });

            if (uploadPromises.length === 0) {
                alert('No items to upload!');
                return;
            }

            Promise.all(uploadPromises)
            .then(results => {
                if (results.every(r => r)) {
                    alert('All items uploaded successfully!');
                } else {
                    alert('Some uploads failed.');
                }
            })
            .catch(error => {
                console.error('Error uploading items:', error);
                alert('Failed to upload data');
            });
        }
    </script>
</body>
</html>
