<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAG AND DROP GAME</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: url(assets/bg1.jpg);
            background-size: cover;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: -20px;
            color: #4fbec8;
            text-shadow: 1px 1px #fff;
        }

        #messageContainer {
            top: 20px;
            width: 50%;
            background-color: rgba(0, 150, 136, 0.9);
            color: #c5cfce;
            padding: 15px 15px;
            font-size: 16px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            margin: 0 auto; 
        }

        .gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px auto;
            max-width: 90%;
        }

        .items-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 320px;
        }

        .item {
            width: 120px;
            height: 120px;
            border: 2px solid rgb(72, 71, 71);
            border-radius: 6px;
            background-color: #fff;
            cursor: grab;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            object-fit: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .item-name {
            margin-top: 5px;
            color: #004d40;
            font-weight: bold;
        }

        .item:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .categories-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: auto;
            margin-bottom: 40px;
        }

        .category {
            width: 250px;
            height: 250px;
            border: 2px solid #004d40;
            border-radius: 10px;
            background-color: #a7ffeb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            position: relative;
        }

        .category:hover {
            background-color: #64ffda;
        }

        .category strong {
            font-size: 1.2em;
            color: #004d40;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .category::before {
            content: attr(data-name);
            position: absolute;
            top: -35px;
            background-color: #006064;
            color: #fff;
            padding: 5px 10px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .points {
            margin: 5px 0 20px;
            font-size: 1.5em;
            color: #c5cfce;
            font-weight: bold;
        }
        #backto {
            margin-left:-1100px;
            padding: 10px 15px;
            border: none;
            background-color: #21ae8d;
            font-size: large;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        #backto:hover {
            background-color: rgb(155, 19, 19);
        }
    </style>
</head>
<body>
    <button id="backto" onclick="back()">⟸</button>
    <h1>DRAG AND DROP GAME</h1>
    <div class="points" id="pointsDisplay">Points: 0</div>
    <div id="messageContainer"></div>
    <div class="gameContainer">
        <div class="items-container" id="itemsContainer"></div>       
        <div class="categories-container" id="categoriesContainer"></div>
    </div>

    <script>
        function back() {
            fetch('http://localhost:5105/clear-items', {
                method: 'DELETE' // or 'POST', depending on your backend setup
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = "index.html"; // Redirect only after successful delete
                } else {
                    alert('Failed to clear data.');
                }
            })
            .catch(error => {
                console.error('Error clearing data:', error);
                alert('Error clearing data.');
            });
        }
        document.addEventListener('DOMContentLoaded', () => {
            const itemsContainer = document.getElementById('itemsContainer');
            const categoriesContainer = document.getElementById('categoriesContainer');
            const pointsDisplay = document.getElementById('pointsDisplay');
            const messageContainer = document.getElementById('messageContainer');

            let points = 0;
            let totalItems = 0;
            let taskId = 1;

            function loadTask(taskId) {
                fetch(`http://localhost:5105/items/${taskId}`)
                    .then(response => {
                        if (!response.ok) throw new Error('Task not found');
                        return response.json();
                    })
                    .then(items => {
                        if (items.length === 0) {
                            showMessage(`🎉 Game Over! All tasks completed. Final Score: ${points}`, true);
                            return;
                        }

                        totalItems = items.length;
                        itemsContainer.innerHTML = '';
                        categoriesContainer.innerHTML = '';

                        const categories = {};
                        const categoryNamesMap = {};

                        items.forEach(item => {
                            if (!categories[item.categoryId]) {
                                categories[item.categoryId] = {
                                    name: item.categoryName,
                                    items: []
                                };
                            }
                            categories[item.categoryId].items.push(item);
                        });

                        // Create categories
                        Object.entries(categories).forEach(([categoryId, category]) => {
                            categoryNamesMap[categoryId] = category.name;

                            const categoryDiv = document.createElement('div');
                            categoryDiv.classList.add('category');
                            categoryDiv.setAttribute('data-category', categoryId);
                            categoryDiv.setAttribute('data-name', category.name);
                            categoryDiv.ondragover = (event) => event.preventDefault();
                            categoryDiv.ondrop = function (event) {
                                event.preventDefault();
                                const itemId = event.dataTransfer.getData("text");
                                const itemElement = document.getElementById(itemId);
                                if (itemElement) {
                                    const correctCategoryId = itemElement.getAttribute('data-category');
                                    const correctCategoryName = categoryNamesMap[correctCategoryId];

                                    if (correctCategoryId === categoryId) {
                                        points++;
                                        showMessage('✅ Correct!', true);
                                    } else {
                                        showMessage(`❌ Wrong! Correct: ${correctCategoryName}`, false);
                                    }

                                    categoryDiv.appendChild(itemElement);
                                    itemElement.setAttribute('draggable', 'false');
                                    pointsDisplay.textContent = `Points: ${points}`;

                                    // Check if all items are placed
                                    if (document.querySelectorAll('.item[draggable="true"]').length === 0) {
                                        setTimeout(() => {
                                            showMessage(`✅ Task ${taskId} Completed! Loading next...`, true);
                                            taskId++;
                                            setTimeout(() => loadTask(taskId), 2000);
                                        }, 2000);
                                    }
                                }
                            };

                            categoriesContainer.appendChild(categoryDiv);
                        });

                        // Create items
                        items.forEach(item => {
                            const itemDiv = document.createElement('div');
                            itemDiv.classList.add('item');
                            itemDiv.id = `item-${item._id}`;
                            itemDiv.draggable = true;
                            itemDiv.setAttribute('data-category', item.categoryId);
                            itemDiv.ondragstart = function (event) {
                                event.dataTransfer.setData("text", event.target.id);
                            };

                            const imageDiv = document.createElement('div');
                            imageDiv.style.width = '100%';
                            imageDiv.style.height = '90%';
                            imageDiv.style.backgroundImage = `url(http://localhost:5105${item.imageUrl})`;
                            imageDiv.style.backgroundSize = 'cover';
                            imageDiv.style.backgroundPosition = 'center';

                            const nameDiv = document.createElement('div');
                            nameDiv.classList.add('item-name');
                            nameDiv.textContent = item.itemName;

                            itemDiv.appendChild(imageDiv);
                            itemDiv.appendChild(nameDiv);
                            itemsContainer.appendChild(itemDiv);
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching items:', error);
                        showMessage(`🎮 Game Over! Final Score: ${points}`, false);
                    });
            }

            function showMessage(message, isCorrect) {
                messageContainer.textContent = message;
                messageContainer.style.border = isCorrect
                    ? '4px solid rgba(76, 175, 80, 0.9)'
                    : '2px solid rgba(244, 67, 54, 0.9)';
                messageContainer.style.display = 'block';

                setTimeout(() => {
                    messageContainer.style.display = 'none';
                }, 2000);
            }

            loadTask(taskId); // Start the first task
        });
    </script>
</body>
</html>
