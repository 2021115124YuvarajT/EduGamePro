<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Save the Character Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 600px;
    }
    #game-container {
      margin: 100px 500px 100px 500px;
    }
    .question {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .option-btn {
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .option-btn:hover {
      background-color: #0056b3;
    }
    #feedback {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="starting-message" style="font-size: 22px; font-weight: bold; display: none;">
    <!-- This will be updated dynamically -->
  </div>

  <div class="container" id="game-container" style="display: none;">
    <!-- <div class="container"> -->
      <div id="question-area">
        <div id="question-number">Question 1 of 10</div>
        <div class="question" id="question-text"></div>
        <div id="options"></div>
      </div>
      <p id="feedback"></p>
    <!-- </div> -->
  </div>

  <script>
    // Get elements
    const startingMessageDiv = document.getElementById("starting-message");
    const gameContainer = document.getElementById("game-container");

    // Detect which game this is (optional, or set from Flask)
    const gameName = "{{ game_name }}";  // Example: pass this as a context variable from Flask

    // Show starting message for 2 seconds before first question
    startingMessageDiv.innerText = `${gameName} is starting now...`;
    startingMessageDiv.style.display = "block";

    setTimeout(() => {
      startingMessageDiv.style.display = "none";
      gameContainer.style.display = "inline-block";
      showQuestion();  // Call your existing question renderer
    }, 4000);

    questions = {{ questions | tojson }};
    let currentQuestion = 0;
    let correctAnswers = 0;
    const startTime = Date.now();

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("question-number").innerText = `Question ${currentQuestion + 1} of 10`;
      document.getElementById("question-text").innerText = q.question;

      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;

        // Support both correct_index and answer-based checking
        if ('correct_index' in q) {
          btn.onclick = () => checkAnswer(index, q.correct_index, null);
        } else if ('answer' in q) {
          btn.onclick = () => checkAnswer(null, null, opt, q.answer);
        }

        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, correctIndex, selectedText = null, correctText = null) {
      console.log("Selected Index:", selectedIndex, "Selected Text:", selectedText);
      console.log("Correct Index:", correctIndex, "Correct Text:", correctText);

      let isCorrect = false;

      if (correctIndex !== null && selectedIndex !== null) {
        isCorrect = selectedIndex === correctIndex;
      } else if (correctText !== null && selectedText !== null) {
        isCorrect = selectedText === correctText;
      }

      if (isCorrect) {
        correctAnswers++;
        document.getElementById("feedback").innerText = "✅ Correct!";
      } else {
        document.getElementById("feedback").innerText = "❌ Incorrect!";
      }

      setTimeout(() => {
        document.getElementById("feedback").innerText = "";
        currentQuestion++;

        if (currentQuestion < questions.length) {
          showQuestion();
        } else {
          // === Metric Calculation Begins ===
          const totalTime = Math.floor((Date.now() - startTime) / 1000);  // in seconds
          const maxTime = 300;  // Set max allowed time to 5 minutes (can adjust)
          const maxScore = questions.length;
          const score = correctAnswers;

          // Long-Term Memory (LTM) and Short-Term Memory (STM)
          const ltm = parseFloat((score / maxScore).toFixed(2));
          const stm = parseFloat((score / maxScore).toFixed(2));  // same in this context

          // IQ: Use constant or dynamically from user profile
          const iq = 7;

          // Working Memory (WM)
          const alpha = 0.6, beta = 0.4;
          const wm = parseFloat((alpha * stm + beta * iq / 10).toFixed(2));

          // AVPI: Time taken vs max time (lower is better)
          const avpi = parseFloat((totalTime / maxTime).toFixed(2));

          // AVP Score: Blend of STM and speed
          const avp = parseFloat((0.7 * stm + 0.3 * (1 - avpi)).toFixed(2));

          // PSI: Psychological Stamina Index
          const psiRaw = (maxTime - totalTime) / maxTime;
          const psi = parseFloat(psiRaw.toFixed(2));

          // ATI: Attention Index
          const processingTimeScore = 1 - avpi;
          const taskCompletion = score === maxScore ? 1 : 0;
          const ati = parseFloat((0.5 * processingTimeScore + 0.5 * taskCompletion).toFixed(2));

          // ATN: Attention Score with STM
          const atn = parseFloat((0.5 * stm + 0.5 * ati).toFixed(2));

          // Final metrics object
          const metrics = {
            total_time: totalTime,
            task_completion: taskCompletion,
            stm,
            ltm,
            wm,
            psi,
            avp,
            ati,
            atn
          };

          // === Metric Submission ===
          fetch("/submit_save_character_game", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(metrics)
          })
          .then(res => res.json())
          .then(data => {
            window.location.href = data.next_url;
          });
        }
      }, 800);
    }

    // Load first question
    showQuestion();
  </script>
</body>
</html>
