<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step-by-Step Viewer</title>
  <link rel="stylesheet" href="styles/steps.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-image: linear-gradient(to right top, #d72f82, #c32671, #ae1d61, #991551, #850c42);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h1 {
      color: aliceblue;
    }

    .carousel-container {
      width: 80%;
      max-width: 500px;
      height: 600px;
      position: relative;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: none; /* Initially hidden until data is loaded */
    }

    .carousel-slide {
      display: none;
      text-align: center;
    }

    .carousel-slide img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .carousel-slide p {
      font-size: 1.2rem;
      color: #333;
      margin-top: 20px;
      padding: 0 20px;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 2rem;
      border: none;
      padding: 10px;
      cursor: pointer;
    }

    .prev-btn { left: -50px; }
    .next-btn { right: -50px; }

    .loading {
      text-align: center;
      font-size: 1.5rem;
      color: white;
      margin-bottom: 20px;
    }

    .game-btn {
      display: none;
      margin: 20px auto; 
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #e59d0e;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .game-btn:hover {
      background-color: #e44673;
    }

    button {
      background-color: transparent;
      border: 2px solid white;
    }

    .backbtn {
      margin-top: 0px;
      margin-left: -600px;
    }

    .backbtn:hover {
      background-color: #d61414;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <span>
      <button class="backbtn" onclick="goto()">Back</button>
    </span>
    <span>
      <h1 class="header">Step by step approach</h1>
    </span>
  </div>

  <!-- Loading message -->
  <div id="loading" class="loading">Loading...</div>

  <div class="carousel-container" id="carousel-container">
    <div id="carousel" class="carousel">
      <!-- Slides will be injected here dynamically -->
    </div>

    <button class="carousel-btn prev-btn" id="prev-btn">&lt;</button>
    <button class="carousel-btn next-btn" id="next-btn">&gt;</button>

    <button class="game-btn" id="game-btn" onclick="goto()">Back</button>
  </div>

  <script>
    let steps = [];
    let currentStep = 0;

    // Get references to the DOM elements
    const loading = document.getElementById('loading');
    const stepContainer = document.getElementById('carousel');
    const carouselContainer = document.getElementById('carousel-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const gameBtn = document.getElementById('game-btn');

    // Fetch steps from the server
    async function fetchSteps() {
      try {
        const response = await fetch('http://localhost:5002/steps');
        if (!response.ok) {
          throw new Error('Failed to fetch steps');
        }
        steps = await response.json();

        if (steps.length > 0) {
          if (loading) loading.style.display = 'none'; // Hide loading message
          carouselContainer.style.display = 'block'; // Show carousel
          updateStep();
        } else {
          if (loading) loading.textContent = 'No steps available.';
        }
      } catch (error) {
        console.error('Error fetching steps:', error);
        if (loading) loading.textContent = 'Error loading steps. Please try again later.';
      }
    }

    // Sound effects for navigation
    const nextSound = new Audio('sounds/next.mp3');
    const prevSound = new Audio('sounds/previous.mp3');

    // Update the current step's image and description
    function updateStep() {
      stepContainer.innerHTML = ''; // Clear existing slides
      const step = steps[currentStep];

      const slide = document.createElement('div');
      slide.className = 'carousel-slide';
      slide.style.display = 'block'; // Display the current slide

      const img = document.createElement('img');
      img.src = `http://localhost:5002${step.image}`;
      slide.appendChild(img);

      const description = document.createElement('p');
      description.textContent = step.description;
      slide.appendChild(description);

      stepContainer.appendChild(slide);

      // Enable or disable navigation buttons
      prevBtn.disabled = currentStep === 0;
      nextBtn.disabled = currentStep === steps.length - 1;

      // Show the "Game" button on the last step
      gameBtn.style.display = currentStep === steps.length - 1 ? 'block' : 'none';

      // Use TTS to speak the description
      speakDescription(step.description);
    }

    // Event listeners for navigation buttons
    prevBtn.addEventListener('click', () => {
      if (currentStep > 0) {
        currentStep--;
        prevSound.play();
        prevSound.onended = updateStep;
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentStep < steps.length - 1) {
        currentStep++;
        nextSound.play();
        nextSound.onended = updateStep;
      }
    });

    // Text-to-Speech function
    function speakDescription(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(utterance);
    }

    // Event listener for the "Game" button
    gameBtn.addEventListener('click', () => {
      window.location.href = '../../learning.html';
    });

    function goto() {
      window.location.href = "../../learning.html";
    }

    // Initialize by fetching steps
    fetchSteps();
  </script>

</body>
</html>
