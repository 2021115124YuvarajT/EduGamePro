<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-image: linear-gradient(to right top, #d72f82, #c32671, #ae1d61, #991551, #850c42);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: aliceblue;
      text-align: center;
    }

    .content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.1); /* Light translucent background */
      border-radius: 10px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    .content-container h1 {
      margin-bottom: 20px; /* Space below the heading */
    }

    .content-container p {
      margin: 10px 0 20px 0; /* Space above and below the paragraph */
    }

    .content-container button {
      padding: 10px 20px;
      font-size: 1rem;
      color: #fff;
      background-color: #ff6f91; /* Light pink button color */
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .content-container button:hover {
      background-color: #ff5778; /* Slightly darker pink on hover */
      transform: scale(1.05); /* Slightly enlarge on hover */
    }

    .content-container button:active {
      transform: scale(0.95); /* Slightly shrink on click */
    }

    /* Bubble Animation Background */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 192, 203, 0.2) 0%, rgba(255, 192, 203, 0) 60%);
      z-index: -1;
      overflow: hidden;
    }

    @keyframes bubbleAnimation {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
      }
    }

    .bubble {
      position: absolute;
      bottom: -10%;
      width: 40px;
      height: 40px;
      background-color: rgba(255, 192, 203, 0.6);
      border-radius: 50%;
      animation: bubbleAnimation 8s infinite ease-in-out;
      z-index: -1;
    }

    .bubble:nth-child(1) {
      left: 10%;
      width: 50px;
      height: 50px;
      animation-duration: 9s;
    }

    .bubble:nth-child(2) {
      left: 20%;
      width: 40px;
      height: 40px;
      animation-duration: 7s;
    }

    .bubble:nth-child(3) {
      left: 35%;
      width: 60px;
      height: 60px;
      animation-duration: 11s;
    }

    .bubble:nth-child(4) {
      left: 50%;
      width: 45px;
      height: 45px;
      animation-duration: 8s;
    }

    .bubble:nth-child(5) {
      left: 70%;
      width: 55px;
      height: 55px;
      animation-duration: 10s;
    }

    .bubble:nth-child(6) {
      left: 85%;
      width: 35px;
      height: 35px;
      animation-duration: 6s;
    }
  </style>
</head>
<body>
  <!-- Bubble animation background -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="content-container">
    <h1>Welcome to the Home Page!</h1>
    <p>Enjoy learning with interactive guides and quizzes.</p>
    <button onclick="Goto()">Learn</button>
  </div>

  <script>
    function Goto(){
      alert('Navigating to Learn Section!');
      window.location.href = 'steps.html';
    }
  </script>
</body>
</html>
