<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background: url('assets/bg2.jpeg');
            background-repeat: no-repeat;
            background-size: cover;
        }

        h1 {
            color: aliceblue;
        }
    
        .container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 20px;
        }
    
        .clues, .crossword {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    
        .clues {
            width: 250px;
            text-align: left;
        }
    
        .clues h2 {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
    
        ul {
            padding: 0;
        }
    
        li {
            margin: 10px 0;
            font-size: 16px;
        }
    
        #crosswordGrid {
            display: flex;
            flex-direction: column;
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #000;
        }
    
        #crosswordGrid div {
            display: flex;
        }
    
        #crosswordGrid input {
            border: 1px solid #000;
            width: 30px;
            height: 30px;
            text-align: center;
            font-size: 18px;
            text-transform: uppercase;
            box-sizing: border-box;
        }
    
        #crosswordGrid input:disabled {
            background-color: black;
            border: 1px solid black;
        }
    
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
        }
    
        button:hover {
            background: #218838;
        }
    
        #resultMessage {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            color: aliceblue;
        }
    </style>    
    
</head>
<body>
    <h1>Solve the Crossword</h1>

    <div class="container">
        <div class="clues">
            <h2>Clues</h2>
            <ul id="cluesList"></ul>
        </div>
    
        <div class="crossword">
            <h2>Crossword Grid</h2>
            <div id="crosswordGrid"></div>
        </div>
    </div>    

    <button id="checkAnswers">Check Answers</button>
    <p id="resultMessage"></p>
    <button id="checkAnswers" onclick="back()">Back</button>

    <script>
        const GRID_SIZE = 10;

        // Function to load the crossword from localStorage
        function loadCrossword() {
            let storedData = localStorage.getItem("crosswordPuzzle");
            if (!storedData) {
                alert("No crossword puzzle found! Please create one first.");
                return;
            }

            let { grid, words } = JSON.parse(storedData);
            displayClues(words);
            createCrosswordGrid(grid, words); // Pass 'words' to the createCrosswordGrid function
        }

        // Function to display the clues
        function displayClues(words) {
            let cluesList = document.getElementById("cluesList");
            cluesList.innerHTML = "";  // Clear previous clues

            words.forEach((entry, index) => {
                let listItem = document.createElement("li");
                listItem.style.listStyle = 'none';
                let orientation = entry.orientation ? ` (${entry.orientation})` : '';
                let wordLength = entry.word.length;
                listItem.textContent = `${index + 1}. ${entry.clue} (${wordLength} letters${orientation})`;
                cluesList.appendChild(listItem);
            });
        }

        // Function to create an interactive crossword grid
        function createCrosswordGrid(grid, words) {
            let crosswordContainer = document.getElementById("crosswordGrid");
            crosswordContainer.innerHTML = "";
            
            for (let i = 0; i < GRID_SIZE; i++) {
                let rowDiv = document.createElement("div");
                rowDiv.style.display = "flex";
                
                for (let j = 0; j < GRID_SIZE; j++) {
                    let cell = document.createElement("input");
                    cell.type = "text";
                    cell.maxLength = 1;
                    cell.style.width = "30px";
                    cell.style.height = "30px";
                    cell.style.textAlign = "center";
                    cell.style.fontSize = "18px";
                    cell.style.textTransform = "uppercase";
                    
                    if (grid[i][j]) {
                        cell.dataset.correct = grid[i][j]; // Store the correct answer
                    } else {
                        cell.disabled = true;
                        cell.style.backgroundColor = "black";
                    }
                    
                    rowDiv.appendChild(cell);
                }
                
                crosswordContainer.appendChild(rowDiv);
            }

            // Add question numbers to first letter positions
            words.forEach((entry, index) => {
                if (entry.startPosition) {
                    let [row, col] = entry.startPosition;
                    let cell = crosswordContainer.children[row].children[col];
                    cell.placeholder = index + 1; // Display the question number
                }
            });
        }

        // Function to check user answers
        function checkAnswers() {
            let inputs = document.querySelectorAll("#crosswordGrid input");
            let allCorrect = true;

            inputs.forEach(input => {
                if (!input.disabled) {
                    let correctLetter = input.dataset.correct;
                    if (input.value.toUpperCase() === correctLetter) {
                        input.style.backgroundColor = "lightgreen"; // Correct answer
                    } else {
                        input.style.backgroundColor = "lightcoral"; // Incorrect answer
                        allCorrect = false;
                    }
                }
            });

            document.getElementById("resultMessage").textContent = 
                allCorrect ? "Congratulations! You solved the crossword!" : "Some answers are incorrect. Try again!";
        }

        // Load crossword when page loads
        window.onload = loadCrossword;

        // Add event listener for checking answers
        document.getElementById("checkAnswers").addEventListener("click", checkAnswers);

        function back() {
            window.location.href = 'create.html';
        }
    </script>
</body>
</html>
