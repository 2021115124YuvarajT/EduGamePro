<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step-by-Step Learning</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Pacifico', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #7e3e8e;
      color: #4c6482;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      color: #9ac3e7;
    }

    h2 {
      color: #4c6482;
    }

    .step {
      display: none;
      margin-bottom: 20px;
      border: 2px solid #b4a7b7;
      border-radius: 8px;
      padding: 20px;
      position: relative;
    }

    .step.active {
      display: block;
      border-color: #c1cbdd;
      box-shadow: 0 0 15px #c1cbdd;
    }

    .step img {
      max-width: 100%;
      border-radius: 8px;
    }

    .navigation {
      text-align: center;
    }

    .navigation button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      background-color: #4c6482;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .navigation button:disabled {
      background-color: #b4a7b7;
      cursor: not-allowed;
    }

    .navigation button:hover {
      background-color: #c1cbdd;
    }

    .feedback {
      text-align: center;
      margin-top: 20px;
    }

    .feedback button {
      font-size: 24px;
      margin: 0 10px;
      cursor: pointer;
    }

    .exit-btn {
      margin-top: 20px;
      text-align: center;
    }

    .exit-btn button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #c1cbdd;
      color: white;
      cursor: pointer;
    }

    .exit-btn button:hover {
      background-color: #ca00fe;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="topicTitle">Step-by-Step Learning</h1>

    <div id="stepsContainer"></div>

    <div class="navigation">
      <button id="prevBtn" onclick="prevStep()" disabled>Previous</button>
      <button id="nextBtn" onclick="nextStep()">Next</button>
    </div>

    <div class="feedback">
      <h2>How did you feel about this step?</h2>
      <button onclick="giveFeedback('😊')">😊</button>
      <button onclick="giveFeedback('😐')">😐</button>
      <button onclick="giveFeedback('😞')">😞</button>
    </div>

    <div class="exit-btn">
      <button onclick="exitPage()">Exit</button>
    </div>
  </div>

  <script>
    let currentStep = 0;
    let stepsData = [];
  
    // Sound effects
    const stepSound = new Audio('../assets/sounds/step-sound.wav');
    const breakSound = new Audio('../assets/sounds/break-sound.wav');
    const startSound = new Audio('../assets/sounds/start-sound.wav');
  
    function playSound(sound) {
      sound.play();
    } 
  
    // Fetch data from MongoDB through the backend API
    fetch("http://localhost:5004/get-preview")
      .then(response => response.json())
      .then(data => {
        if (data) {
          document.getElementById('topicTitle').textContent = data.topic;
          stepsData = data.categories;
  
          // Dynamically populate steps
          const stepsContainer = document.getElementById('stepsContainer');
          stepsData.forEach((category, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.classList.add('step');
            if (index === 0) stepDiv.classList.add('active');
  
            stepDiv.innerHTML = `
              <h2>${category.name}</h2>
              <img src="${category.image}" alt="${category.name}" />
              <p>${category.description}</p>
              <button onclick="speak('${category.description}')">🔊 Listen</button>
            `;
            stepsContainer.appendChild(stepDiv);
          });
  
          // Update steps visibility
          updateSteps();
        }
      })
      .catch(error => {
        console.error('Error fetching preview data:', error);
        alert('Failed to load data');
      });
  
    // Animate on page load
    window.addEventListener('DOMContentLoaded', () => {
      gsap.from('.container', {
        y: '-100%',
        duration: 1,
        ease: 'bounce',
        onComplete: () => playSound(startSound)
      });
    });
  
    // Update steps visibility
    function updateSteps() {
      const steps = document.querySelectorAll('.step');
      steps.forEach((step, index) => {
        step.classList.toggle('active', index === currentStep);
      });
      document.getElementById('prevBtn').disabled = currentStep === 0;
      document.getElementById('nextBtn').disabled = currentStep === stepsData.length - 1;
    }
  
    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        updateSteps();
        animateStep('next');
      }
    }
  
    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        updateSteps();
        animateStep('prev');
      }
    }
  
    function animateStep(direction) {
      const activeStep = document.querySelector('.step.active');
      const xValue = direction === 'next' ? '100%' : '-100%';
  
      gsap.fromTo(
        activeStep,
        { x: xValue, opacity: 0 },
        { x: '0%', opacity: 1, duration: 1, ease: 'power2.out' }
      );
      playSound(stepSound);
    }
  
    function speak(text) {
      const speech = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(speech);
    }
  
    function giveFeedback(emoji) {
      alert(`Thank you for your feedback: ${emoji}`);
    }
  
    function exitPage() {
      playSound(breakSound);
      window.history.back(); // Navigate to the previous page
    }
  </script>  
</body>

</html>
