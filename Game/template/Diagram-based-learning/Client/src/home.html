<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Teaching Platform</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #4a90e2, #6a11cb);
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      opacity: 0;
    }

    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      opacity: 0;
    }

    .btn {
      display: inline-block;
      background: #ff6b6b;
      color: #fff;
      padding: 15px 35px;
      border-radius: 50px;
      font-size: 18px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease-in-out;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      transform: scale(1.1);
      background: #ff4757;
    }
  </style>
</head>
<body>

  <h1>Interactive Teaching Platform</h1>
  <div class="container">
    <a href="add_elements.html" class="btn" id="addElements">Add Elements</a>
    <a href="view_pages.html" class="btn" id="viewPages">View Added Pages</a>
    <a href="../../../learning.html" class="btn" id="viewPages">Back</a>
  </div>

  <script>
    // GSAP Animations
    gsap.to("h1", { opacity: 1, y: -10, duration: 1, ease: "power3.out" });
    gsap.to(".container", { opacity: 1, y: 10, duration: 1, delay: 0.5, ease: "power3.out" });

    // Animate both buttons separately
    gsap.from("#addElements", { opacity: 1, y: 20, duration: 0.8, delay: 0.6, ease: "back.out(1.7)" });
    gsap.from("#viewPages", { opacity: 1, y: 20, duration: 0.8, delay: 0.8, ease: "back.out(1.7)" });
  </script>

</body>
</html>
