<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Pages</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4a90e2, #6a11cb);
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .back {
      margin-left: 200px;
    }
    #pages-container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    .page-entry {
      border: 1px solid #ccc;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-entry img {
      display: block;
      margin: 5px 0;
      max-width: 100px;
      height: auto;
    }
    .page-entry audio {
      display: block;
      margin: 5px 0;
    }
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: red;
    }
  </style>
</head>
<body>
  <h1>Saved Pages</h1>
  <button class="back" onclick="window.location.href='home.html'">Go Home</button>
  <div id="pages-container"></div>
  <script src="view_pages.js"></script>
</body>
</html>
