<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: url('rainbow_bg.jpg');
            background-repeat: no-repeat;
            background-size: 100% 100%;
            
        }

        /* Title Styling */
        .big-title {
            color:black;
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            backdrop-filter: blur(10px);
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Container Styling */
        .container {
            color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 100px;
        }

        /* Stylish h1 */
        h1 {
            font-size: 28px;
            font-weight: bold;
            
            text-align: center;
            text-transform: uppercase;
            font-family: 'Raleway', sans-serif;
            letter-spacing: 2px;
            
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.5);
            position: relative;
            padding-bottom: 10px;
        }

        /* Stylish h2 */
        h2 {
            font-size: 22px;
            font-weight: bold;
            color: rgb(18, 2, 2);
            text-align: center;
            text-transform: uppercase;
            font-family: 'Raleway', sans-serif;
            letter-spacing: 1.5px;
            position: relative;
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .button-container button {
            background-color: #007BFF;
            color: white;
            font-size: 18px;
            padding: 14px 28px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 180px;
            max-width: 220px;
            font-weight: bold;
        }

        .button-container button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .button-container button:active {
            background-color: #003f7f;
            transform: scale(1);
        }

        #backbtn {
            background-color: #ff0000;
            max-width: 100%;
            font-size:large;
        }

        #backbtn:hover {
            background-color: darkred;
        }

        @media (max-width: 600px) {
            .button-container {
                flex-direction: column;
                align-items: center;
            }

            .button-container button {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <!-- Title -->
    <h1 class="big-title">Welcome to Gamified Learning</h1>

    <div class="container">
        <h1>Time to enjoy and learn!!</h1>

        <h2>📚 Learning Modules</h2>

        <div class="button-container">
            <button onclick="goto1()">Step by Step</button>
            <button onclick="goto2()">Classification</button>
        </div>

        <div class="button-container">
            <button onclick="goto3()">Chart Based</button>
            <button onclick="goto4()">Map Based</button>
        </div>

        <div class="button-container">
            <button onclick="goto5()">Diagram Based</button>
        </div>

        <div class="button-container">
            <button id="backbtn" onclick="back()">⬅ Back</button>
        </div>
    </div>

    <script>
        function goto1() { window.location.href = "stepbystep/frontend/stepupload.html"; }
        function goto2() { window.location.href = "code_classification_template/frontend/user_form.html"; }
        function goto3() { window.location.href = "http://127.0.0.1:5000"; }
        function goto4() { window.location.href = "http://127.0.0.1:8000"; }
        function goto5() { window.location.href = "Diagram-based-learning/Client/src/home.html"; }
        function back() { window.location.href = "index.html"; }
    </script>

</body>

</html>
