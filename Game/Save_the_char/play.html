<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: url('assets/bg1.jpg') no-repeat center center;
            background-size: 100% 100%;
            backdrop-filter: blur(8px); /* Apply blur to the background */
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-top: -60px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        div {
            display: flex;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            color: #fff;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            outline: none;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Save the King</h1>
    <div>
        <button onclick="back()">Back</button>
        <button onclick="goto()">Input</button>
    </div>
</body>
<script>
    function goto() {
        window.location.href = "input.html";
    }
    function back() {
        window.location.href = "../template/games.html";
    }
</script>
</html>
