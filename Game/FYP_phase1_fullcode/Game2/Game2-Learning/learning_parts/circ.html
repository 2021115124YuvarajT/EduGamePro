<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulatory System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #e0f7fa, #ffebee);
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #007bff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        #heartImage, #heartGif {
            width: 400px;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }
        #heartImage:hover, #heartGif:hover {
            transform: scale(1.05);
        }
        .description-box {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: inline-block;
            text-align: left;
        }
        .button-container {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .button-container button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .button-container button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .highlight {
            background-color: #ffa500 !important; /* Highlight color */
        }
        #explanation {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        #listenButton {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            transition: background-color 0.3s, transform 0.2s;
        }
        #listenButton:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        #backButton {
            position: fixed;
            left: 20px;
            bottom: 20px;
            background-color: #007bff;
        }
        #nextButton {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background-color: #007bff;
        }
    </style>
</head>
<body>

    <h1>Circulatory System</h1>

    <div class="description-box">
        <p>The circulatory system is responsible for transporting blood throughout the body. It consists of: Heart, Blood Vessels, and Blood.</p>
        <button id="listenButton" onclick="listenOverall()">🔊 Listen</button>
    </div>

    <div class="container">
        <img id="heartImage" src="./images/circulatory_system.jpg" alt="Heart Anatomy">
        <img id="heartGif" src="./gif/circ.gif" alt="Heart Animation">
    </div>

    <div class="button-container">
        <button onclick="showExplanation(1, this)">1. Right Pulmonary Veins</button>
        <button onclick="showExplanation(2, this)">2. Right Pulmonary Artery</button>
        <button onclick="showExplanation(3, this)">3. Right Atrium</button>
        <button onclick="showExplanation(4, this)">4. Right Ventricle</button>
        <button onclick="showExplanation(5, this)">5. Aorta</button>
        <button onclick="showExplanation(6, this)">6. Left Pulmonary Veins</button>
        <button onclick="showExplanation(7, this)">7. Left Pulmonary Artery</button>
        <button onclick="showExplanation(8, this)">8. Left Atrium</button>
        <button onclick="showExplanation(9, this)">9. Left Ventricle</button>
        <button onclick="showExplanation(10, this)">10. Cardiac Muscle</button>
    </div>

    <div id="explanation">Click on a button to learn about each part.</div>

    <button id="backButton" onclick="window.location.href='resp.html'">Back</button>
    <button id="nextButton" onclick="window.location.href='exc.html'">Next System >></button>

    <script>
        let currentSpeech = null; // Currently speaking TTS
        const explanations = {
            1: "The right pulmonary veins carry oxygenated blood from the right lung back to the left atrium of the heart.",
            2: "The right pulmonary artery transports deoxygenated blood from the right ventricle to the right lung for oxygenation.",
            3: "The right atrium receives deoxygenated blood from the body via the superior and inferior vena cavae.",
            4: "The right ventricle pumps deoxygenated blood to the lungs through the pulmonary arteries.",
            5: "The aorta is the main artery that carries oxygenated blood from the left ventricle to the rest of the body.",
            6: "The left pulmonary veins carry oxygenated blood from the left lung back to the left atrium of the heart.",
            7: "The left pulmonary artery carries deoxygenated blood from the right ventricle to the left lung for oxygenation.",
            8: "The left atrium receives oxygenated blood from the lungs via the pulmonary veins.",
            9: "The left ventricle pumps oxygenated blood into the aorta for distribution throughout the body.",
            10: "The cardiac muscle, or myocardium, is the muscular tissue of the heart that enables it to contract and pump blood."
        };

        function showExplanation(partNumber, button) {
            // If the same button is clicked, stop the TTS if it's currently speaking
            if (currentSpeech && currentSpeech.text === explanations[partNumber]) {
                window.speechSynthesis.cancel(); // Stop speaking
                currentSpeech = null; // Clear current speech
                clearHighlight(); // Clear button highlight
               // document.getElementById('explanation').innerText = "Click on a button to learn about each part."; // Reset explanation
                return; // Exit function
            }

            // Cancel previous speech
            if (currentSpeech) {
                window.speechSynthesis.cancel();
            }

            // Remove highlight from all buttons
            clearHighlight();
            // Highlight the current button
            button.classList.add('highlight');

            // Show the explanation text
            const explanationText = explanations[partNumber] || "Information not available.";
            document.getElementById('explanation').innerText = explanationText;
            speakText(explanationText);
        }

        function clearHighlight() {
            const allButtons = document.querySelectorAll('.button-container button');
            allButtons.forEach(btn => btn.classList.remove('highlight'));
        }

        function listenOverall() {
            const overallText = "The circulatory system is responsible for transporting blood throughout the body. It consists of: Heart, Blood Vessels, and Blood.";
            // If the TTS is currently speaking the overall text, stop it
            if (currentSpeech && currentSpeech.text === overallText) {
                window.speechSynthesis.cancel(); // Stop speaking
                currentSpeech = null; // Clear current speech
                return; // Exit function
            }

            // Cancel previous speech
            if (currentSpeech) {
                window.speechSynthesis.cancel();
            }

            // Speak the overall explanation
            speakText(overallText);
        }

        function speakText(text) {
            currentSpeech = new SpeechSynthesisUtterance(text);
            currentSpeech.rate = 1;
            window.speechSynthesis.speak(currentSpeech);
        }
    </script>
</body>
</html>
