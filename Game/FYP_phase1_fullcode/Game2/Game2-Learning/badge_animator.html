<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Badge</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #121212;
      margin: 0;
    }
    .badge-container {
      perspective: 1000px;
      animation: spin-and-zoom 2s ease-in-out forwards;
    }
    .badge {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.5);
      animation: glow 1.5s infinite alternate, horizontal-spin 2s ease-in-out forwards;
    }
    .ok-button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #ff5733;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      outline: none;
    }
    @keyframes spin-and-zoom {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.5); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes horizontal-spin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    @keyframes glow {
      0% { box-shadow: 0 0 10px 3px rgba(225, 232, 1, 0.4); }
      100% { box-shadow: 0 0 30px 10px rgba(247, 247, 6, 0.8); }
    }
    .badge.stopped {
      animation: none;
      box-shadow: none;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="badge-container">
    <img src="Classification_Trophy.png" alt="Badge" class="badge" id="badge">
  </div>
  <button class="ok-button" onclick="stopAnimation()">OK</button>

  <script>
    function stopAnimation() {
      document.getElementById("badge").classList.add("stopped");
      window.location.href = 'main.html';
    }
  </script>
</body>
</html>
