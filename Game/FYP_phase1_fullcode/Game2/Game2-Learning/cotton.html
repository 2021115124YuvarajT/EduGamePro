<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotton to Fabric Process</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: rgba(53, 43, 43, 0.9);
        }

        .process-container {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            position: relative;
            color: azure;
        }

        h1 {
            color: azure;
        }

        .process-step {
            text-align: center;
            width: 700px;
            position: relative;
        }

        .process-step img {
            width: 100px;
            height: auto;
        }

        #character {
            position: absolute;
            width: 100px;
            height: 150px;
            top: 280px; /* Position the character above the process steps */
            left: 50px;
            transition: left 1s; /* Animate movement */
        }

        #nextButton, #backButton {
            margin-top: 130px;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        .alert-box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
            display: none; /* Initially hidden */
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Ensure it's on top */
        }

        .alert-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .alert-content p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .alert-content button {
            background-color: #2ad924; /* Red button */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .alert-content button:hover {
            background-color: #d32f2f; /* Darker red on hover */
        }

    </style>
</head>
<body>

    <h1>Cotton to Fabric Process</h1>

    <!-- Process Steps -->
    <div class="process-container">
        <div id="step1" class="process-step">
            <strong>Cotton Balls</strong><br><br><br>
            <img src="/pics/cotton/cotton_balls.png" alt="Cotton Balls">
        </div>

        <div id="step2" class="process-step">
            <strong>Ginning</strong><br><br><br>
            <img src="/pics/cotton/ginning.png" alt="Cotton Fiber" style="width: 150px;">
        </div>

        <div id="step2" class="process-step">
            <strong>Cotton Fiber</strong><br><br><br>
            <img src="/pics/cotton/cotton_fiber.png" alt="Cotton Fiber">
        </div>

        <div id="step3" class="process-step">
            <strong>Lint</strong><br><br><br><br>
            <img src="/pics/cotton/lint.png" alt="Lint">
        </div>

        <div id="step3" class="process-step">
            <strong>Spinning</strong><br><br><br><br>
            <img src="/pics/cotton/spinning.png" alt="Lint" style="width: 150px;">
        </div>

        <div id="step4" class="process-step">
            <strong>Yarn</strong><br><br><br>
            <img src="/pics/cotton/yarn.png" alt="Yarn">
        </div>

        <div id="step5" class="process-step">
            <strong>Weaving/Knitting</strong><br><br><br>
            <img src="/pics/cotton/weaving.png" alt="Weaving" style="width: 150px;">
            <br><br><br>
            <img src="/pics/cotton/knitting.png" alt="Knitting" style="width: 150px;">
        </div>

        <div id="step6" class="process-step">
            <strong>Fabric</strong><br><br><br>
            <img src="/pics/cotton/fabric.png" alt="Fabric" style="width: 150px;">
        </div>
    </div>

    <!-- Button to move to next step -->
    <button id="backButton" onclick="goTo()">Back</button>
    <button id="nextButton" onclick="moveCharacter()">Next</button>
    <div>
        <img id="character" src="/pics/cotton/hand.png" alt="Character">
    </div>

    <div id="custom-alert" class="alert-box">
        <div class="alert-content">
          <p id="alert-message">Incorrect</p>
          <button id="close-alert" onclick="closeAlert()">OK</button>
        </div>
    </div>

    <script>
        // JavaScript to move the character
        let currentStep = 0;

        function moveCharacter() {
            const totalSteps = 8;
            const stepWidth = document.querySelector('.process-step').offsetWidth;
            const container = document.querySelector('.process-container');
            
            if (currentStep < totalSteps - 1) {
                currentStep++;

                // Move the character to the next step
                const leftPosition = stepWidth * currentStep;
                document.getElementById('character').style.left = leftPosition + 'px';
            } else {
                // Disable the button after the final step
                showAlert("Process completed!");
                document.getElementById('nextButton').disabled = true;
            }
        }

        // Function to show the custom alert
        function showAlert(message) {
            const alertBox = document.getElementById('custom-alert');
            const alertMessage = document.getElementById('alert-message');
            alertMessage.textContent = message; // Set the custom message
            alertBox.style.display = 'flex'; // Show the alert box
        }

        // Function to close the custom alert
        function closeAlert() {
            document.getElementById('custom-alert').style.display = 'none'; // Hide the alert box
        }

        function goTo() {
            window.location.href = 'resources4.html';
        }
    </script>

</body>
</html>
