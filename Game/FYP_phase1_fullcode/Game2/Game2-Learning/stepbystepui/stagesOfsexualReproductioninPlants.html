<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stages in Sexual Reproduction of Plants</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e8f5e9;
            margin: 0;
            padding: 0;
            display: flex; 
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2e7d32;
            margin-top: 20px;
        }
        .flowchart {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            width: 100%;
            max-width: 1200px;
        }
        .step-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 0 20px;
        }
        .step {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
            border: 3px solid transparent;
            border-radius: 10px;
            padding: 10px;
        }
        .step.active {
            border: 3px solid #2e7d32;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .step:hover {
            transform: scale(1.05);
        }
        .step img {
            width: 150px;
            height: auto;
            border-radius: 10px;
        }
        .number {
            background-color: #2e7d32;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .line {
            width: 100px;
            height: 0;
            border-top: 2px dotted #2e7d32;
            position: absolute;
            top: 50%;
            left: 100%;
            z-index: -1;
            margin-left: 50px;
        }
        .line::after {
            content: '';
            position: absolute;
            right: -10px;
            top: -5px;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid #2e7d32;
        }
        .step-container:last-child .line {
            display: none;
        }
        #description {
            margin-top: 20px;
            padding: 20px;
            width: 80%;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 1.2em;
            color: #1b5e20;
            text-align: center;
        }
        #message {
            margin-top: 20px;
            font-size: 1.2em;
            color: #2e7d32;
            text-align: center;
        }

        button {
            margin-top: 50px;
            margin-left: -1000px;
            padding: 10px 20px;
            font-size: large;
            background-color: #00796b;
            color: #e0f7fa;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button onclick="goTo()">Back</button>
    <h1>Stages in Sexual Reproduction of Plants</h1>

    <div class="flowchart">
        <!-- Step 1: Gamete Formation -->
        <div class="step-container">
            <div class="number">1</div>
            <div class="step" id="gamete-formation" onclick="displayStep(0)">
                <img src="gifs/reproduction_gamete_formation.gif" alt="Gamete Formation">
                <p>Gamete Formation</p>
            </div>
            <div class="line"></div>
        </div>

        <!-- Step 2: Pollination -->
        <div class="step-container">
            <div class="number">2</div>
            <div class="step" id="pollination" onclick="displayStep(1)">
                <img src="gifs/flowering_pollination.gif" alt="Pollination">
                <p>Pollination</p>
            </div>
            <div class="line"></div>
        </div>

        <!-- Step 3: Fertilization -->
        <div class="step-container">
            <div class="number">3</div>
            <div class="step" id="fertilization" onclick="displayStep(2)">
                <img src="gifs/reproduction_fertilization.gif" alt="Fertilization">
                <p>Fertilization</p>
            </div>
            <div class="line"></div>
        </div>

        <!-- Step 4: Seed Development -->
        <div class="step-container">
            <div class="number">4</div>
            <div class="step" id="seed-development" onclick="displayStep(3)">
                <img src="gifs/reproduction_seed_development.gif" alt="Seed Development">
                <p>Seed Development</p>
            </div>
            <div class="line"></div>
        </div>

        <!-- Step 5: Seed Dispersal -->
        <div class="step-container">
            <div class="number">5</div>
            <div class="step" id="seed-dispersal" onclick="displayStep(4)">
                <img src="gifs/flowering_dispersal.gif" alt="Seed Dispersal">
                <p>Seed Dispersal</p>
            </div>
        </div>
    </div>

    <!-- Description Section -->
    <div id="description">
        Click on a step to learn about the stages in sexual reproduction of plants.
    </div>

    <!-- Message Section -->
    <div id="message"></div>

    <script>
        let level = 5;
        const stages = [
            {
                text: "Gamete Formation: The process in which the male and female gametes (sex cells) are produced in the reproductive organs.",
                tts: "Gamete Formation. The process in which the male and female gametes, or sex cells, are produced in the reproductive organs."
            },
            {
                text: "Pollination: The transfer of pollen from the anther (male part) to the stigma (female part) of a flower.",
                tts: "Pollination. The transfer of pollen from the anther, the male part, to the stigma, the female part, of a flower."
            },
            {
                text: "Fertilization: The fusion of male and female gametes to form a zygote, which eventually develops into a seed.",
                tts: "Fertilization. The fusion of male and female gametes to form a zygote, which eventually develops into a seed."
            },
            {
                text: "Seed Development: The zygote matures into a seed, which contains the embryo of the future plant.",
                tts: "Seed Development. The zygote matures into a seed, which contains the embryo of the future plant."
            },
            {
                text: "Seed Dispersal: Seeds are spread away from the parent plant by various agents like wind, water, or animals to start a new life cycle.",
                tts: "Seed Dispersal. Seeds are spread away from the parent plant by various agents like wind, water, or animals to start a new life cycle."
            }
        ];

        let currentSpeech = null;
        let currentStage = 0;

        // Initialize the first stage to be highlighted
        highlightStep(currentStage);

        function displayStep(stageIndex) {
            // Ensure the user follows the correct sequence
            if (stageIndex !== currentStage) return;

            // Stop the previous speech if it's playing
            if (currentSpeech) {
                window.speechSynthesis.cancel();
            }

            // Update description text
            const description = document.getElementById("description");
            description.innerText = stages[stageIndex].text;

            // Initiate TTS for the current stage
            currentSpeech = new SpeechSynthesisUtterance(stages[stageIndex].tts);
            currentSpeech.lang = 'en-US';
            currentSpeech.rate = 100;
            // When TTS ends, move to the next stage
            currentSpeech.onend = () => {
                // Show alert or message after speech completion
                if (currentStage < stages.length - 1) {
                    document.getElementById("message").innerText = "You completed this stage. Move to the next one.";
                } else {
                    checkCompletion(level);
                    document.getElementById("message").innerText = "You have completed all the stages in sexual reproduction of plants!";
                }
                // Move to the next stage
                currentStage++;
                if (currentStage < stages.length) {
                    highlightStep(currentStage);
                }
            };

            window.speechSynthesis.speak(currentSpeech);
        }

        function highlightStep(stageIndex) {
            // Remove the 'active' class from all steps
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });

            // Highlight the current stage
            document.querySelectorAll('.step')[stageIndex].classList.add('active');
        }
        function checkCompletion(level){
            let completedTopics = JSON.parse(localStorage.getItem('completedSbsTopics'))|| [];
            if(!completedTopics.includes(level)){
                completedTopics.push(level);
                localStorage.setItem('completedSbsTopics',JSON.stringify(completedTopics));
            }
            console.log("Completion recorded:", completedTopics);
        }
        function goTo() {
            window.location.href = 'stepbystep.html';
        }
    </script>

</body>
</html>
