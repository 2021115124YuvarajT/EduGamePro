<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step-by-Step Subtraction with Borrowing</title>
  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        background-color: #f4f4f9;
        font-family: Arial, sans-serif;
    }

    .subtraction-container {
        font-size: 2.5rem;
        text-align: center;
        margin-bottom: 40px;
    }

    .heading {
        font-size: 2.5rem;
        text-align: center;
        margin-bottom: 40px;
        color: rebeccapurple;
        font-family: Arial, Helvetica, sans-serif;
    }

    .number-row {
        margin: 10px;
        color: blueviolet;
        display: flex;
        justify-content: center;
    }

    .result-row {
        margin: 10px;
        color: green;
    }

    .operation {
        color: blue;
        text-align: right;
        margin: 0;
        padding: 0;
    }

    .borrow-row {
        margin: 10px;
        font-size: 1.6rem;
        color: green;
        height: 30px;
        display: flex;
        justify-content: center;
    }

    .line {
        border-top: 2px solid black;
        width: 80px;
        margin: 10px auto;
    }

    .highlight-container {
        margin-top: 20px;
        font-size: 2rem;
        text-align: center;
    }

    .highlighted-digits {
        font-size: 2.5rem;
        color: red;
    }

    .borrow {
        font-size: 1.5rem;
        position: relative;
        top: -20px;
        color: green;
    }

    .new-borrow {
        font-size: 1.5rem;
        position: relative;
        top: -20px;
        color: green;
    }

    /* Styling for the refresh button */
    .refresh-btn {
      padding: 15px 30px;
      background-color: rgb(87, 203, 232);
      color: aliceblue;
      font-weight: bold;
      font-size: large;
      border-radius: 10%;
      border-color: white;
    }
  </style>
</head>
<body>
  <div class="heading">Subtraction of Two Numbers</div>
  <div class="subtraction-container">
    <div class="borrow-row" id="borrowRow"></div>
    <div class="number-row" id="num1"></div>
    <div class="number-row" id="num2"></div>
    <div class="operation" id="op">-</div>
    <div class="line"></div>
    <div class="result-row" id="result">?</div>
    <div class="line"></div>
  </div>

  <div class="highlight-container">
    <div class="highlighted-digits" id="highlightedDigits"></div>
  </div>

  <button class="refresh-btn" onclick="refreshPage()">Refresh Page</button>

  <script>
    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let num1 = getRandomInt(1, 9);
    let num2 = getRandomInt(0, 9);

    if (num2 > num1) {
        [num1, num2] = [num2, num1];
    }

    let formattedNum2 = num2.toString();
    console.log(`Subtraction: ${num1} - ${formattedNum2}`);

    let result = '';
    let borrowArray = [];
    let initialBorrowDelay = 1000;
    let initialSubtractionDelay = 2000;
    let perStepDelay = 2000;

    function animateSubtraction() {
        const digits1 = num1.toString().split('').reverse();
        const digits2 = formattedNum2.split('').reverse();

        let borrowRowContent = new Array(digits1.length).fill('&nbsp;');
        document.getElementById('num1').innerHTML = formatNumber(num1);
        document.getElementById('num2').innerHTML = formatNumber(formattedNum2);
        document.getElementById('result').innerHTML = '?';

        let borrowNeeded = false;
        digits1.forEach((digit1, index) => {
            let digit2 = digits2[index] || 0;
            if (parseInt(digit1) < parseInt(digit2)) {
                borrowNeeded = true;
                let borrowedDigit1 = parseInt(digit1) + 10;
                borrowRowContent[index] = borrowedDigit1.toString();
                if (index + 1 < digits1.length) {
                    digits1[index + 1] = (parseInt(digits1[index + 1]) - 1).toString();
                    borrowRowContent[index + 1] = digits1[index + 1];
                }
            }
        });

        if (borrowNeeded) {
            setTimeout(() => {
                updateBorrowRow(borrowRowContent, 0, () => {
                    performSubtractionSteps();
                });
            }, initialBorrowDelay);
        } else {
            setTimeout(() => {
                performSubtractionSteps();
            }, initialBorrowDelay);
        }
    }

    function performSubtractionSteps() {
        const digits1 = num1.toString().split('').reverse();
        const digits2 = formattedNum2.split('').reverse();
        let stepDelay = initialSubtractionDelay;
        let totalSteps = digits1.length;

        function processStep(index) {
            if (index >= totalSteps) {
                document.getElementById('result').innerHTML = formatResult(result);
                return;
            }

            let digit1 = digits1[index];
            let digit2 = digits2[index] || 0;
            let currentDigit;

            if (parseInt(digit1) < parseInt(digit2)) {
                let borrowedDigit1 = parseInt(digit1) + 10;
                currentDigit = borrowedDigit1 - parseInt(digit2);

                if (index + 1 < digits1.length) {
                    digits1[index + 1] = (parseInt(digits1[index + 1]) - 1).toString();
                }

                displaySubtractionStep(borrowedDigit1, digit2, currentDigit, index, () => {
                    result = currentDigit + result;
                    document.getElementById('result').innerHTML = formatResult(result);
                    processStep(index + 1);
                });
            } else {
                currentDigit = parseInt(digit1) - parseInt(digit2);

                displaySubtractionStep(digit1, digit2, currentDigit, index, () => {
                    result = currentDigit + result;
                    document.getElementById('result').innerHTML = formatResult(result);
                    processStep(index + 1);
                });
            }
        }

        processStep(0);
    }

    function displaySubtractionStep(digit1, digit2, currentDigit, index, callback) {
        const highlightedDigitsElement = document.getElementById('highlightedDigits');
        highlightedDigitsElement.innerHTML = `${digit1} - ${digit2} = ${currentDigit}`;

        setTimeout(() => {
            highlightedDigitsElement.innerHTML = '';
            if (callback) callback();
        }, 3000);
    }

    function updateBorrowRow(borrowRowContent, index, callback) {
        if (index >= borrowRowContent.length) {
            if (callback) callback();
            return;
        }

        setTimeout(() => {
            const borrowRowElement = document.getElementById('borrowRow');
            borrowRowElement.innerHTML = borrowRowContent.slice(0, index + 1).reverse().join(' &nbsp;&nbsp;');
            updateBorrowRow(borrowRowContent, index + 1, callback);
        }, 1000);
    }

    function formatResult(result) {
        return result.split('').join(' &nbsp;');
    }

    function formatNumber(num) {
        return num.toString().split('').join(' &nbsp;');
    }

    // Function to refresh page(itself)
    function refreshPage() {
      location.reload();
    }

    document.getElementById('num1').innerHTML = '';
    document.getElementById('num2').innerHTML = '';
    document.getElementById('borrowRow').innerHTML = '';
    document.getElementById('highlightedDigits').innerHTML = '';
    document.getElementById('result').innerHTML = '';
    animateSubtraction();
  </script>
</body>
</html>
